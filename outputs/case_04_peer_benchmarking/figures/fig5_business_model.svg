<text x="48" y="556" font-size="11" fill="#1b2733">普洛斯与中航易商都在 1.3× 以上，但钱的来源相反：普洛斯靠减值与调整项，易商靠原始权益人 NOI 补足。</text>
<text x="48" y="574" font-size="10.5" fill="#6b7a88">深国际 0.89× 是全组最低——当年分得比挣得少；这不是优点也不是缺点，而是“还有留存可托底”的余量。</text>
