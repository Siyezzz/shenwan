<text x="48" y="472" font-size="11" fill="#1b2733">本项目两只都落在 3.5–4：资产本身不差，但没有一项进入前二。</text>
<text x="48" y="490" font-size="10.5" fill="#6b7a88">盐田港在两种算法下从第 4 跳到第 3——它对“租期是否计入”敏感，是六只里位次最不稳的一只，不宜据此断言其资产优于本项目。</text>
<text x="48" y="506" font-size="10.5" fill="#6b7a88">最大租户列不并入资产质量：它衡量客户结构，与资产好坏是两个问题（见 §5.4）。</text>
<line x1="36" y1="520" x2="904" y2="520" stroke="#e3e8ee"/>
<text x="36" y="538" font-size="10.5" fill="#6b7a88">位次＝该标的中位名次，是描述性统计，不是评分模型；宝湾、易商的租金同比因 2024 年不足整年而缺，该维不参与其位次计算</text>
