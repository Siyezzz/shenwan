name: REIT 508601 model validation

concurrency:
  group: reit-508601-model-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/build_model.py"
      - "tools/build_bottomup.py"
      - "tools/validate_model.py"
      - "tests/run_tests.py"
      - "models/**"
      - "outputs/case_03_sinofarm_reit/**"
      - ".github/workflows/reits-model-validation.yml"
  push:
    branches: [main]
    paths:
      - "tools/build_model.py"
      - "tools/build_bottomup.py"
      - "tools/validate_model.py"
      - "tests/run_tests.py"
      - "models/**"
      - "outputs/case_03_sinofarm_reit/**"
      - ".github/workflows/reits-model-validation.yml"

permissions:
  contents: write

jobs:
  validate-508601:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc
      - name: Rebuild bottom-up scenarios
        run: python tools/build_bottomup.py --csv models/scenario_2028.csv
      - name: Rebuild Excel model
        run: python tools/build_model.py
      - name: Recalculate Excel formulas with LibreOffice
        run: |
          mkdir -p /tmp/recalc
          libreoffice --headless --convert-to xlsx --outdir /tmp/recalc models/cash_flow_model.xlsx
          test -s /tmp/recalc/cash_flow_model.xlsx
          cp /tmp/recalc/cash_flow_model.xlsx models/cash_flow_model.xlsx
      - name: Validate workbook against independent Python engine
        run: python tools/validate_model.py
      - name: Run repository regression tests
        run: python tests/run_tests.py
      - name: Count final report body
        run: python tools/count_report_words.py outputs/case_03_sinofarm_reit/report_508601.md --min 15000 --json outputs/case_03_sinofarm_reit/report_metrics.json
      - name: Commit rebuilt model artifacts to the PR branch
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/cash_flow_model.xlsx models/scenario_2028.csv outputs/case_03_sinofarm_reit/report_metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate 508601 model artifacts [skip ci]"
            git fetch origin "${HEAD_REF}"
            git rebase "origin/${HEAD_REF}"
            git push origin "HEAD:${HEAD_REF}"
          else
            echo "Generated model artifacts are already up to date."
          fi
      - name: Upload reproducible model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reit-508601-model-validation
          path: |
            models/cash_flow_model.xlsx
            models/scenario_2028.csv
            outputs/case_03_sinofarm_reit/report_metrics.json
          retention-days: 14
